<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #17171a;
    --muted: #6f6a63;
    --accent: #4b5842;
    --line: rgba(23,23,26,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  nav{
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 48px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  nav a{
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 3px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  nav a:hover, nav a.current{
    color: var(--ink);
    border-color: var(--accent);
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 5.5vw, 46px);
    margin: 0 0 8px;
    text-align: center;
  }
  h1 em{ color: var(--accent); font-style: italic; }

  .subtitle{
    color: var(--muted);
    font-size: 15px;
    margin: 0 auto 48px;
    max-width: 460px;
    text-align: center;
    line-height: 1.6;
  }



.wall {
    display: grid;
    grid-template-columns: repeat(12, 1fr);

    grid-auto-rows: 50px;

    gap: 8px;
    padding: 15px;

    grid-auto-flow: dense;
}



.wall img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 10px;

    display: block;

    transition: 
        grid-column 0.3s ease,
        grid-row 0.3s ease,
        transform 0.3s ease;

    cursor: pointer;
}




.img44 {
    grid-column: span 4;
    grid-row: span 4;
}


.img43 {
    grid-column: span 4;
    grid-row: span 3;
}

.img33 {
    grid-column: span 3;
    grid-row: span 3;
}


.img32 {
    grid-column: span 3;
    grid-row: span 2;
}

.img22 {
    grid-column: span 2;
    grid-row: span 2;
}


.img44:hover {
    grid-column: span 5;
    grid-row: span 5;
}


.img43:hover {
    grid-column: span 5;
    grid-row: span 4;
}


.img33:hover {
    grid-column: span 4;
    grid-row: span 4;
}


.img32:hover {
    grid-column: span 4;
    grid-row: span 3;
}

.img22:hover {
    grid-column: span 3;
    grid-row: span 3;
}
  

</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a href="birthday.html">message</a>
    <a href="gallery.html">gallery</a>
    <a href="wall.html" class="current">photo wall</a>
  </nav>

  <h1>The <em>full wall</em></h1>
  <p class="subtitle">Happy Birthday Anvi.</p>

</div>

<div class="wall">

    <img class="img44" src="">
    <img class="img22" src="">
    <img class="img43" src="">
    <img class="img33" src="">
    <img class="img32" src="">

    <img class="img22" src="">
    <img class="img44" src="">
    <img class="img33" src="">
    <img class="img43" src="">

</div>


</body>
</html>
