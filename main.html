<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #17171a;
    --muted: #6f6a63;
    --accent: #4b5842;
    --line: rgba(23,23,26,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  .wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  nav{
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 48px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  nav a{
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 3px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  nav a:hover, nav a.current{
    color: var(--ink);
    border-color: var(--accent);
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 5.5vw, 46px);
    margin: 0 0 8px;
    text-align: center;
  }
  h1 em{ color: var(--accent); font-style: italic; }

  .subtitle{
    color: var(--muted);
    font-size: 15px;
    margin: 0 auto 48px;
    max-width: 460px;
    text-align: center;
    line-height: 1.6;
  }

  

  .tile{
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--surface);
    cursor: default;
    transform: scale(1);
    transition: transform 0.25s ease, opacity 0.25s ease, box-shadow 0.25s ease;
    transform-origin: center;
    will-change: transform;
  }

  .tile img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #ece9e2;
  }

  @media (prefers-reduced-motion: reduce){
    .tile{ transition: none; }
  }

  .instructions{
    margin-top: 40px;
    padding: 20px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }
  .instructions code{
    background: var(--bg);
    padding: 2px 6px;
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a href="birthday.html">message</a>
    <a href="gallery.html">gallery</a>
    <a href="wall.html" class="current">photo wall</a>
  </nav>

  <h1>The <em>full wall</em></h1>
  <p class="subtitle">Happy Birthday Anvi.</p>

</div>



</body>
</html>
