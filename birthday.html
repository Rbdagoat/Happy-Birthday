<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #17171a;
    --muted: #6f6a63;
    --accent: #4b5842;
    --line: rgba(23,23,26,0.12);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  .wrap{
    max-width: 680px;
    margin: 0 auto;
    padding: 72px 24px 96px;
  }

  nav{
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 56px;
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  nav a{
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    padding-bottom: 3px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  nav a:hover, nav a.current{
    color: var(--ink);
    border-color: var(--accent);
  }

  .eyebrow{
    text-align: center;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    text-align: center;
    font-size: clamp(38px, 7vw, 60px);
    line-height: 1.1;
    margin: 0 0 14px;
  }
  h1 em{
    color: var(--accent);
    font-style: italic;
  }

  .subtitle{
    text-align: center;
    font-size: 16px;
    color: var(--muted);
    max-width: 440px;
    margin: 0 auto 52px;
    line-height: 1.6;
  }

  .candles{
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .candle{
    width: 2px;
    height: 42px;
    background: var(--line);
    position: relative;
  }
  .candle::before{
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 9px;
    background: var(--accent);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .candles.blown .candle::before{
    opacity: 0;
    transform: translateX(-50%) scale(0.3);
  }
  .candles-hint{
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 56px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px;
  }

  .card-label{
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-label::before{
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    display: inline-block;
  }

  textarea{
    width: 100%;
    min-height: 160px;
    background: transparent;
    border: none;
    outline: none;
    resize: vertical;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    line-height: 1.7;
  }
  textarea::placeholder{ color: #b6b1a8; }

  .footer-note{
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 44px;
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a href="birthday.html" class="current">message</a>
    <a href="gallery.html">gallery</a>
    <a href="wall.html">photo wall</a>
  </nav>

  <p class="eyebrow">A little something for</p>
  <h1>Happy Birthday,<br><em>[Name]</em></h1>
  <p class="subtitle">Edit this page to make it yours — swap the name, the message below, and the colors if you like.</p>

  <div class="candles" id="candles">
    <div class="candle"></div>
    <div class="candle"></div>
    <div class="candle"></div>
    <div class="candle"></div>
  </div>
  <p class="candles-hint" id="candlesHint">click the candles to blow them out</p>

  <div class="card">
    <div class="card-label">Your message</div>
    <textarea placeholder="Write your birthday message here...">Hey! Hope your day is full of everything you love — cake, chaos, and zero adulting responsibilities. So glad you exist. Here's to another year of us causing trouble together. Love you tons!</textarea>
  </div>

  <p class="footer-note">made with love, just for you</p>
</div>

<script>
  const candles = document.getElementById('candles');
  const hint = document.getElementById('candlesHint');
  candles.addEventListener('click', () => {
    candles.classList.toggle('blown');
    hint.textContent = candles.classList.contains('blown')
      ? 'make a wish'
      : 'click the candles to blow them out';
  });
</script>

</body>
</html>
